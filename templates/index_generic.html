<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>The Carbon Project - Moon Rabbit</title>
    <link
      href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="static/style.css" />
    <script src="/static/plotly.min.js"></script>
  </head>
  <body>
    <header class="header">
    <nav>
      <div class="sidebar-button" onclick="toggleMenu()">
        <i class="bx bx-menu"></i> <!-- Hamburger menu icon -->
        <div class="menu-items">
          <div class="close-button" onclick="toggleMenu()">X</div> <!-- Close button -->
          <a href="#" class="menu-item" onclick="updateLat()">Update&nbsp;Latitude</a>
          <a href="#" class="menu-item" onclick="updateLong()">Update&nbsp;Longitude</a>
          <a href="#" class="menu-item" onclick="updateSW()">Update&nbsp;Software</a>
          <a href="#" class="menu-item" onclick="loadGlobalCO2()">Global&nbsp;CO2&nbsp;Map</a>
          <a href="#" class="menu-item" onclick="handleRebootClick()">Reboot</a>
          <a href="#" class="menu-item" onclick="handleShutdownClick()">Shutdown</a>
        </div>
      </div>
    </nav>
    <div class="label-value-container">
        <div class="location-info">
            <label>Latitude:</label>
            <span id="latitude">0.0000</span>
            <label>Longitude:</label>
            <span id="longitude">0.0000</span>
            <label for="time-range">Select Time Range:</label>
            <div class="dropdown">
                <button class="dropbtn">Choose</button>
                <div class="dropdown-content">        
                  <a href="#" data-value="pause">Pause</a>
                  <a href="#" data-value="realtime">Realtime</a>
                  <a href="#" data-value="1_hour">1 Hour</a>
                  <a href="#" data-value="1_day">1 Day</a>
                  <a href="#" data-value="1_week">1 Week</a>
                  <a href="#" data-value="1_month">1 Month</a>
                  <a href="#" data-value="1_year">1 Year</a>
                  <a href="#" data-value="10_years">10 Years</a>
                </div>
            </div>
        </div>
    </div>
    </header>
    <section class="home-section">

      <div class="home-content">
        <!-- GENERIC SENSOR BOXES -->
        <div class="overview-boxes" id="sensor-boxes"></div>

        <!-- HISTORY CHARTS AND GAUGES -->
        <div class="graph-box">
          <div class="history-charts">
            <div class="title">History Charts</div>
            <div class="history-details">
              <div class="history-col-item" id="history-container"></div>
            </div>
          </div>
          <div class="gaugeCharts">
            <div class="gauge-list" id="gauge-container"></div>
          </div>
        </div>
      </div>
    </section>
    <script src="static/dashboard.js"></script>
  </body>
</html>
